{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
    <div class="login-container">
        <h2>Welcome to SmartLightSystem</h2>
        <p>Please log in using Google to access the dashboard.</p>
        <a href="{{ url_for('google.login') }}" class="login-btn">
            <div class="google-icon"></div>
            <span class="google-text">Sign in with Google</span>
        </a>
    </div>
{% endblock %}
